[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-coding-agent"
version = "0.2.0"
description = "Autonomous AI coding and multi-agent system builder exposed through MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
    "openai-agents>=0.6,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
mcp-coding-agent = "mcp_coding_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_coding_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
